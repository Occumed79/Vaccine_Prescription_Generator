name: CDC adult vaccine data export

on:
  push:
    branches:
      - data/cdc-neon-export
    paths:
      - scripts/export_cdc_neon_bundle.py
      - .github/workflows/cdc-neon-export.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CDC Neon bundle
        run: python scripts/export_cdc_neon_bundle.py
      - name: Upload downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: CDC_Adult_Vaccine_Data_for_Neon
          path: CDC_Adult_Vaccine_Data_for_Neon.zip
          retention-days: 7
          if-no-files-found: error
